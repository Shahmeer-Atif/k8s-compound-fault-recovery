# 3 control-plane nodes + 2 workers. Primary experimental configuration.
# kind automatically provisions an haproxy load balancer in front of the API servers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: control-plane
  - role: control-plane
  - role: worker
  - role: worker
